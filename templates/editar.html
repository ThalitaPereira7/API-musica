<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Música</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Editar Música</h1>

    <form method="post" action="/editar/{{ musica_id }}">
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo" value="{{ musica['titulo'] }}" required><br>

        <label for="cantor">Cantor:</label>
        <input type="text" id="cantor" name="cantor" value="{{ musica['cantor'] }}" required><br>

        <label for="genero">Gênero:</label>
        <input type="text" id="genero" name="genero" value="{{ musica['genero'] }}" required><br>

        <label for="ano">Ano:</label>
        <input type="number" id="ano" name="ano" value="{{ musica['ano'] }}" required><br>

        <label for="foto">URL da Foto:</label>
        <input type="url" id="foto" name="foto" value="{{ musica['foto'] }}" required><br>

        <button type="submit">Salvar</button>
    </form>

    <form method="post" action="/deletar/{{ musica_id }}">
        <button type="submit" style="background-color: red; color: white;">Excluir Música</button>
    </form>

    <a href="/">Voltar</a>
</body>
</html>
